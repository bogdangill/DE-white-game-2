{% extends "page-template.html" %}

{% block metaTitle %}
    Wer wir sind
{% endblock %}

{% block header %}
    <header class="header">
        <div class="header__inner">
            <button class="header__burger" data-popup-trigger></button>
            <div class="header__search">
                <img src="images/search.svg" alt="Search Icon" class="header__search-icon">
                <input type="text" placeholder="Wonach suchen Sie?" class="header__search-input">
            </div>
            <img src="images/notifications.png" alt="Notifications">
        </div>
    </header>
{% endblock %}

{% block main %}
    <section class="promo mb-section">
        <h2 class="title title--xl promo__title">
            Wer wir<br> sind
        </h2>
        <p class="promo__text">
            Wir sind ein ergebnisorientiertes Team
        </p>
    </section>
    {% include "about.html" %}
    {% include "team.html" %}
{% endblock %}
