<!DOCTYPE html>
<html lang="{{common.LOCALE}}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Aclonica&display=swap" rel="stylesheet">
    
    <title>
        {% block metaTitle %}
        {% endblock %}
    </title>
</head>

<body class="wrapper">
    <div class="menu" data-nav>
        <button class="menu__close" data-popup-close>
        </button>
        <img class="menu__logo" src="images/logo.png" alt="logo">
        <nav class="menu__nav">
            <a data-nav-link href="/" class="menu__link menu__link--home">home</a>
            <a data-nav-link href="/explore-games.html" class="menu__link menu__link--games">Spiele erkunden</a>
            <a data-nav-link href="/who-we-are.html" class="menu__link menu__link--we">Wer wir sind</a>
            <a data-nav-link href="/code-of-conduct.html" class="menu__link menu__link--code">Verhaltenskodex</a>
            <a data-nav-link href="/contacts.html" class="menu__link menu__link--contacts">Kontakte</a>
            <a data-nav-link href="/privacy.html" class="menu__link menu__link--private">Privacy Policy</a>
            <a data-nav-link href="/terms.html" class="menu__link menu__link--terms">Nutzungsbedingungen</a>
        </nav>
    </div>
    {% include "header.html" %}
    <main>
        {% block main %}
        {% endblock %}
    </main>
    <script src="./scripts/index.js" type="module" defer></script>

</html>
