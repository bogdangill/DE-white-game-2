<section class="feedback">
    <h2 class="title feedback__title">
        Abonniere jetzt!
    </h2>
    <form class="feedback-form" data-js-form>
        <h3 class="title title--sm feedback-form__title">
            Tritt unserer Gaming-Community bei
        </h3>
        <div class="feedback-form__grid">
            <input class="feedback-form__input" 
                type="text" 
                placeholder="Gib deinen Namen ein" 
                required 
                data-js-input="name">
            <input class="feedback-form__input" 
                type="tel"
                pattern="(?:\+|\b)(?:\d\s?\(?|\d{2}\s?\(?)?(?:[\d\-\(\)\s]{6,14}\d)" 
                placeholder="Gib deine Telefonnummer ein" 
                required
                data-js-input="phone">
            <input class="feedback-form__input" 
                type="mail"
                pattern="^\S+@\S+\.\S+$" 
                placeholder="Gib deine E-Mail-Adresse ein" 
                required
                data-js-input="mail">
        </div>
        <label class="feedback-form__label">
            <input class="feedback-form__checkbox" type="checkbox" name="privacy" data-js-checkbox="privacy">
            <a href="./privacy.html" class="feedback-form__link">
                Ich akzeptiere die Datenschutzrichtlinie
            </a>
        </label>
        <button type="submit" class="button feedback-form__button">
            Abonniere unseren Newsletter
        </button>
    </form>
</section>
